name: Build license-free OpenLens Native APK

on:
  push:
    branches: [native-vr-mvp-20261114]
    paths:
      - native-android/**
      - .github/workflows/build-openlens-native-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Download official on-device hand model
        run: |
          mkdir -p native-android/app/src/main/assets
          curl --fail --location --retry 3 \
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task' \
            --output native-android/app/src/main/assets/hand_landmarker.task
          test "$(stat -c%s native-android/app/src/main/assets/hand_landmarker.task)" -gt 1000000
      - name: Compile Native Android Debug APK (no Unity license)
        working-directory: native-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK
        run: |
          test -s native-android/app/build/outputs/apk/debug/app-debug.apk
          file native-android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum native-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: OpenLens-NordCE5-Native-Debug-APK
          path: native-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
